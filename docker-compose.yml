version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # EduLearn Application Service (Laravel 13 + Inertia v2 + React 19 + Nginx)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edulearn-app:latest
    container_name: edulearn-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=edu
      - DB_USERNAME=root
      - DB_PASSWORD=1234
      - APP_URL=${APP_URL:-http://localhost:8000}
    volumes:
      - storage_data:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edulearn-network

  # ----------------------------------------------------------------------------
  # MySQL Database Service (Pre-configured with EduLearn schema & seed data)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: edulearn-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: edu
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_USER: edu_user
      MYSQL_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_FORWARD_PORT:-33060}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - edulearn-network

  # ----------------------------------------------------------------------------
  # phpMyAdmin Database Management Interface (Optional GUI)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: edulearn-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - edulearn-network

# ------------------------------------------------------------------------------
# Persistent Volumes & Network Definitions
# ------------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  storage_data:
    driver: local

networks:
  edulearn-network:
    driver: bridge
