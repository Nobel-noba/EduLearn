version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edulearn-app:latest
    container_name: edulearn-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"

    env_file:
      - .env.docker

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      APP_URL: ${APP_URL:-http://localhost:8000}

    volumes:
      - storage_data:/var/www/storage

    networks:
      - edulearn-network

volumes:
  storage_data:
    driver: local

networks:
  edulearn-network:
    driver: bridge