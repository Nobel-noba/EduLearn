version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edulearn-app:latest
    container_name: edulearn-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"

    env_file:
      - .env.docker

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: edulearn
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-1234}

      APP_URL: ${APP_URL:-http://localhost:8000}

    volumes:
      - storage_data:/var/www/storage

    depends_on:
      db:
        condition: service_healthy

    networks:
      - edulearn-network

  db:
    image: postgres:16-alpine
    container_name: edulearn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edulearn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_FORWARD_PORT:-54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edulearn"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - edulearn-network

volumes:
  storage_data:
    driver: local
  pg_data:
    driver: local

networks:
  edulearn-network:
    driver: bridge